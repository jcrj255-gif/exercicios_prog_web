<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="inicio">
      <div class="logo">⚡</div>
      <h1>Quiz JavaScript</h1>
      <p>10 perguntas. Teste seu conhecimento!</p>
      <button id="btnIniciar">Iniciar Quiz</button>
    </div>

    <div id="quiz" hidden>
      <div class="quiz-header">
        <div id="progresso"></div>
        <div id="pontos-live">0 pts</div>
      </div>
      <div class="barra-prog-bg"><div class="barra-prog" id="barraProgresso"></div></div>
      <h2 id="pergunta"></h2>
      <div id="opcoes"></div>
    </div>

    <div id="resultado" hidden></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
