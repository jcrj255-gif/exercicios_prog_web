<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>⚡ Pokédex</h1>
      <div class="busca">
        <input type="text" id="inputPokemon" placeholder="Nome ou número..." autocomplete="off">
        <button id="btnBuscar">Buscar</button>
      </div>
      <div class="nav">
        <button id="btnAnterior">← Anterior</button>
        <span id="numAtual">#001</span>
        <button id="btnProximo">Próximo →</button>
      </div>
    </header>
    <div id="resultado"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
