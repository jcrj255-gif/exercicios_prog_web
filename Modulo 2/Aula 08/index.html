<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Zone</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container">

    <header class="header">
      <h1>🎮 Games House</h1>
    </header>

    <aside class="sidebar">
      <h3>Menu</h3>
      <ul>
        <li>Início</li>
        <li>Jogos</li>
        <li>Notícias</li>
        <li>Contato</li>
      </ul>
    </aside>

    <main class="main">
      <h2>Jogos em destaque</h2>

      <div class="grid-cards">
        <div class="card">FPS</div>
        <div class="card">RPG</div>
        <div class="card">Corrida</div>
        <div class="card">Aventura</div>
        <div class="card">Esportes</div>
        <div class="card">Battle Royale</div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 Games</p>
    </footer>

  </div>

</body>
</html>
